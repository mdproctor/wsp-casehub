<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">YAML Helpdesk — Zero Java Architecture</text>

  <!-- YAML Files Layer -->
  <rect x="20" y="50" width="680" height="90" rx="8" fill="#f0f4ff" stroke="#b0c4de" stroke-width="1.5"/>
  <text x="360" y="70" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Developer creates (YAML only)</text>

  <rect x="40" y="80" width="100" height="45" rx="5" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="90" y="100" text-anchor="middle" font-weight="bold" font-size="11" fill="#4a90d9">app.yaml</text>
  <text x="90" y="115" text-anchor="middle" font-size="10" fill="#666">collections</text>

  <rect x="160" y="80" width="120" height="45" rx="5" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="220" y="100" text-anchor="middle" font-weight="bold" font-size="11" fill="#4a90d9">helpdesk.yaml</text>
  <text x="220" y="115" text-anchor="middle" font-size="10" fill="#666">case lifecycle</text>

  <rect x="300" y="80" width="120" height="45" rx="5" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="360" y="100" text-anchor="middle" font-weight="bold" font-size="11" fill="#4a90d9">descriptors.yaml</text>
  <text x="360" y="115" text-anchor="middle" font-size="10" fill="#666">eidos agents</text>

  <rect x="440" y="80" width="120" height="45" rx="5" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="500" y="100" text-anchor="middle" font-weight="bold" font-size="11" fill="#4a90d9">manifest.yaml</text>
  <text x="500" y="115" text-anchor="middle" font-size="10" fill="#666">LLM / simulator</text>

  <rect x="580" y="80" width="100" height="45" rx="5" fill="#fff" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="630" y="100" text-anchor="middle" font-weight="bold" font-size="11" fill="#4a90d9">page.yaml</text>
  <text x="630" y="115" text-anchor="middle" font-size="10" fill="#666">UI</text>

  <!-- Arrows down -->
  <line x1="90" y1="125" x2="90" y2="170" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="220" y1="125" x2="220" y2="170" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="360" y1="125" x2="360" y2="170" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="500" y1="125" x2="500" y2="170" stroke="#555" marker-end="url(#arrow)"/>
  <line x1="630" y1="125" x2="630" y2="170" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Platform Layer -->
  <rect x="20" y="170" width="680" height="100" rx="8" fill="#f5fff0" stroke="#90c090" stroke-width="1.5"/>
  <text x="360" y="190" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Platform provides (auto-discovered, standard SPIs)</text>

  <rect x="40" y="200" width="130" height="55" rx="5" fill="#fff" stroke="#5a9e5a" stroke-width="1.5"/>
  <text x="105" y="220" text-anchor="middle" font-weight="bold" font-size="11" fill="#5a9e5a">JSON Collections</text>
  <text x="105" y="235" text-anchor="middle" font-size="10" fill="#666">SPI adapter</text>
  <text x="105" y="247" text-anchor="middle" font-size="10" fill="#666">SQLite + concurrency</text>

  <rect x="190" y="200" width="130" height="55" rx="5" fill="#fff" stroke="#5a9e5a" stroke-width="1.5"/>
  <text x="255" y="220" text-anchor="middle" font-weight="bold" font-size="11" fill="#5a9e5a">Case Engine</text>
  <text x="255" y="235" text-anchor="middle" font-size="10" fill="#666">auto-discovery</text>
  <text x="255" y="247" text-anchor="middle" font-size="10" fill="#666">bindings + workers</text>

  <rect x="340" y="200" width="130" height="55" rx="5" fill="#fff" stroke="#5a9e5a" stroke-width="1.5"/>
  <text x="405" y="220" text-anchor="middle" font-weight="bold" font-size="11" fill="#5a9e5a">Eidos + Agent</text>
  <text x="405" y="235" text-anchor="middle" font-size="10" fill="#666">call: agent</text>
  <text x="405" y="247" text-anchor="middle" font-size="10" fill="#666">capability matching</text>

  <rect x="490" y="200" width="90" height="55" rx="5" fill="#fff" stroke="#5a9e5a" stroke-width="1.5"/>
  <text x="535" y="220" text-anchor="middle" font-weight="bold" font-size="11" fill="#5a9e5a">Push</text>
  <text x="535" y="235" text-anchor="middle" font-size="10" fill="#666">topics</text>
  <text x="535" y="247" text-anchor="middle" font-size="10" fill="#666">event bus</text>

  <rect x="600" y="200" width="90" height="55" rx="5" fill="#fff" stroke="#5a9e5a" stroke-width="1.5"/>
  <text x="645" y="220" text-anchor="middle" font-weight="bold" font-size="11" fill="#5a9e5a">Pages</text>
  <text x="645" y="235" text-anchor="middle" font-size="10" fill="#666">renderer</text>
  <text x="645" y="247" text-anchor="middle" font-size="10" fill="#666">data-json</text>

  <!-- Event Flow -->
  <rect x="20" y="290" width="680" height="80" rx="8" fill="#fff8f0" stroke="#d4a06a" stroke-width="1.5"/>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Runtime event flow</text>

  <text x="60" y="340" font-size="11" fill="#333" font-weight="bold">Ticket created</text>
  <line x1="140" y1="336" x2="175" y2="336" stroke="#d4a06a" marker-end="url(#arrow)"/>
  <text x="195" y="340" font-size="11" fill="#333">classify</text>
  <text x="195" y="355" font-size="10" fill="#888">(LLM/sim)</text>
  <line x1="240" y1="336" x2="275" y2="336" stroke="#d4a06a" marker-end="url(#arrow)"/>
  <text x="295" y="340" font-size="11" fill="#333">assign</text>
  <text x="295" y="355" font-size="10" fill="#888">(eidos)</text>
  <line x1="335" y1="336" x2="370" y2="336" stroke="#d4a06a" marker-end="url(#arrow)"/>
  <text x="395" y="340" font-size="11" fill="#333">resolve</text>
  <text x="395" y="355" font-size="10" fill="#888">(human)</text>
  <line x1="440" y1="336" x2="475" y2="336" stroke="#d4a06a" marker-end="url(#arrow)"/>
  <text x="500" y="340" font-size="11" fill="#333">notify</text>
  <text x="500" y="355" font-size="10" fill="#888">(push)</text>
  <line x1="535" y1="336" x2="570" y2="336" stroke="#d4a06a" marker-end="url(#arrow)"/>
  <text x="610" y="340" font-size="11" fill="#2a7a2a" font-weight="bold">Case complete</text>

  <!-- Review Surface -->
  <rect x="20" y="390" width="680" height="80" rx="8" fill="#fff0f5" stroke="#c07090" stroke-width="1.5"/>
  <text x="360" y="410" text-anchor="middle" font-size="12" fill="#666" font-style="italic">Review surface (same YAML, three views)</text>

  <rect x="60" y="420" width="160" height="40" rx="5" fill="#fff" stroke="#c07090" stroke-width="1.5"/>
  <text x="140" y="445" text-anchor="middle" font-size="11" fill="#c07090" font-weight="bold">YAML text</text>

  <rect x="280" y="420" width="160" height="40" rx="5" fill="#fff" stroke="#c07090" stroke-width="1.5"/>
  <text x="360" y="445" text-anchor="middle" font-size="11" fill="#c07090" font-weight="bold">Visual flow</text>

  <rect x="500" y="420" width="160" height="40" rx="5" fill="#fff" stroke="#c07090" stroke-width="1.5"/>
  <text x="580" y="445" text-anchor="middle" font-size="11" fill="#c07090" font-weight="bold">Split (linked)</text>
</svg>