<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#6c757d"/>
    </marker>
  </defs>

  <text x="360" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="#2c3e50">Context Reset: Without vs With Memory Architecture</text>

  <!-- WITHOUT side -->
  <text x="180" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Without</text>

  <!-- Context blocks -->
  <rect x="40" y="70" width="120" height="50" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="100" y="90" text-anchor="middle" font-size="10" fill="#1e8449">Barrett</text>
  <text x="100" y="104" text-anchor="middle" font-size="9" fill="#1e8449">instruction</text>

  <rect x="170" y="70" width="120" height="50" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1"/>
  <text x="230" y="90" text-anchor="middle" font-size="10" fill="#1a5276">200 turns of</text>
  <text x="230" y="104" text-anchor="middle" font-size="9" fill="#1a5276">dialogue &amp; action</text>

  <!-- Arrow to clear -->
  <text x="180" y="140" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">⚡ 80k token clear</text>

  <!-- After clear -->
  <rect x="40" y="155" width="120" height="50" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="100" y="175" text-anchor="middle" font-size="10" fill="#1e8449">Barrett</text>
  <text x="100" y="189" text-anchor="middle" font-size="9" fill="#1e8449">instruction</text>

  <rect x="170" y="155" width="120" height="50" rx="4" fill="#fadbd8" stroke="#e74c3c" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="230" y="175" text-anchor="middle" font-size="10" fill="#922b21">nothing</text>
  <text x="230" y="189" text-anchor="middle" font-size="9" fill="#922b21">total amnesia</text>

  <text x="180" y="230" text-anchor="middle" font-size="10" fill="#922b21">"Who is Clara? Where am I?"</text>
  <text x="180" y="248" text-anchor="middle" font-size="10" fill="#922b21">Body vocab: 75% (fresh) but</text>
  <text x="180" y="266" text-anchor="middle" font-size="10" fill="#922b21">no narrative continuity</text>

  <!-- Divider -->
  <line x1="360" y1="50" x2="360" y2="300" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- WITH side -->
  <text x="540" y="55" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">With</text>

  <!-- Context blocks -->
  <rect x="400" y="70" width="120" height="50" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="460" y="90" text-anchor="middle" font-size="10" fill="#1e8449">Barrett</text>
  <text x="460" y="104" text-anchor="middle" font-size="9" fill="#1e8449">instruction</text>

  <rect x="530" y="70" width="120" height="50" rx="4" fill="#d6eaf8" stroke="#2980b9" stroke-width="1"/>
  <text x="590" y="90" text-anchor="middle" font-size="10" fill="#1a5276">200 turns of</text>
  <text x="590" y="104" text-anchor="middle" font-size="9" fill="#1a5276">dialogue &amp; action</text>

  <!-- Arrow to clear -->
  <text x="540" y="140" text-anchor="middle" font-size="11" fill="#e74c3c" font-weight="bold">⚡ 80k token clear</text>

  <!-- After clear -->
  <rect x="400" y="155" width="120" height="50" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="460" y="175" text-anchor="middle" font-size="10" fill="#1e8449">Barrett</text>
  <text x="460" y="189" text-anchor="middle" font-size="9" fill="#1e8449">instruction</text>

  <rect x="530" y="155" width="120" height="50" rx="4" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="590" y="172" text-anchor="middle" font-size="10" fill="#1e8449">segment cache</text>
  <text x="590" y="186" text-anchor="middle" font-size="9" fill="#1e8449">~2000 tokens</text>
  <text x="590" y="199" text-anchor="middle" font-size="8" fill="#6c757d">condensed + recent</text>

  <text x="540" y="230" text-anchor="middle" font-size="10" fill="#1e8449">"Clara was in the library.</text>
  <text x="540" y="248" text-anchor="middle" font-size="10" fill="#1e8449">Marsh acted strangely near</text>
  <text x="540" y="266" text-anchor="middle" font-size="10" fill="#1e8449">the inscription."</text>
  <text x="540" y="286" text-anchor="middle" font-size="10" fill="#1e8449">Body vocab: 75% + continuity ✓</text>
</svg>
