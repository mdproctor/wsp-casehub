<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Snapshot vs Journal: What You Lose at the End of the Tick</text>

  <!-- Snapshot side -->
  <rect x="20" y="44" width="320" height="280" rx="8" fill="#fff3f3" stroke="#d44" stroke-width="1.5"/>
  <text x="180" y="68" text-anchor="middle" font-weight="bold" fill="#d44" font-size="14">PipelineTrace (Snapshot)</text>

  <rect x="40" y="84" width="280" height="36" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="180" y="106" text-anchor="middle" fill="#666">Attention → Mood → Drives → ...</text>

  <rect x="40" y="128" width="280" height="36" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="180" y="150" text-anchor="middle" fill="#666">... → Appraisal → Regulation → ...</text>

  <rect x="40" y="172" width="280" height="36" rx="4" fill="#fff" stroke="#ddd"/>
  <text x="180" y="194" text-anchor="middle" fill="#666">... → Goals → CAPS → ...</text>

  <line x1="180" y1="216" x2="180" y2="250" stroke="#d44" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="230" y="238" fill="#d44" font-size="11">end of tick</text>

  <rect x="80" y="256" width="200" height="52" rx="6" fill="#d44" stroke="none"/>
  <text x="180" y="278" text-anchor="middle" fill="#fff" font-weight="bold">Final State Only</text>
  <text x="180" y="296" text-anchor="middle" fill="#fcc" font-size="11">No intermediate steps</text>

  <!-- Journal side -->
  <rect x="380" y="44" width="320" height="280" rx="8" fill="#f3fff3" stroke="#2a2" stroke-width="1.5"/>
  <text x="540" y="68" text-anchor="middle" font-weight="bold" fill="#2a2" font-size="14">CognitiveJournal (Entries)</text>

  <rect x="400" y="84" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#cde7cd"/>
  <text x="540" y="102" text-anchor="middle" fill="#2d7a2d" font-size="12">AttentionBriefed</text>

  <rect x="400" y="118" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#cde7cd"/>
  <text x="540" y="136" text-anchor="middle" fill="#2d7a2d" font-size="12">MoodShifted (pre-appraisal)</text>

  <rect x="400" y="152" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#cde7cd"/>
  <text x="540" y="170" text-anchor="middle" fill="#2d7a2d" font-size="12">DriveActivated (first pass)</text>

  <rect x="400" y="186" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#cde7cd"/>
  <text x="540" y="204" text-anchor="middle" fill="#2d7a2d" font-size="12">AppraisalRecorded</text>

  <rect x="400" y="220" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#cde7cd"/>
  <text x="540" y="238" text-anchor="middle" fill="#2d7a2d" font-size="12">MoodShifted (post-appraisal)</text>

  <rect x="400" y="254" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#cde7cd"/>
  <text x="540" y="272" text-anchor="middle" fill="#2d7a2d" font-size="12">RegulationDecided</text>

  <rect x="400" y="288" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#cde7cd"/>
  <text x="540" y="306" text-anchor="middle" fill="#2d7a2d" font-size="12">GoalDecided</text>
</svg>
