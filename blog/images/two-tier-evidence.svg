<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <style>
    .box { rx: 8; ry: 8; stroke-width: 1.5; }
    .label { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .detail { font-size: 11px; fill: #64748b; }
    .cite { font-size: 10px; fill: #6366f1; font-style: italic; }
  </style>

  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">Two-Tier Evidence Model</text>

  <!-- Tier 1 header -->
  <rect x="20" y="50" width="310" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="175" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a">Tier 1 — Peer-Reviewed Direct Evidence</text>

  <!-- Tier 1 items -->
  <rect x="20" y="85" width="310" height="95" class="box" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="35" y="105" class="label">Impulsivity → working memory</text>
  <text x="35" y="120" class="cite">Heydarloo 2024, Kofler 2024</text>
  <text x="35" y="140" class="label">Callousness → empathy deficit</text>
  <text x="35" y="155" class="cite">Blair 2005, 2008, 2013</text>
  <text x="35" y="170" class="label">Anxiousness → threat bias</text>
  <text x="180" y="170" class="cite">Bar-Haim 2007 (d=0.45, n=172)</text>

  <!-- Tier 2 header -->
  <rect x="350" y="50" width="310" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="505" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#d97706">Tier 2 — FFM Bridge Extensions</text>

  <!-- Tier 2 items -->
  <rect x="350" y="85" width="310" height="130" class="box" fill="#fffbeb" stroke="#fde68a"/>
  <text x="365" y="105" class="label">Emotional Lability → affect sensitivity</text>
  <text x="365" y="120" class="detail">→ Neuroticism (FFM) → amplified reactivity</text>
  <text x="365" y="140" class="label">Risk Taking → reduced fear</text>
  <text x="365" y="155" class="detail">→ Disinhibition (PID-5) → lower threat weight</text>
  <text x="365" y="175" class="label">Withdrawal → fewer connections</text>
  <text x="365" y="190" class="detail">→ Detachment (PID-5) → reduced graph density</text>
  <text x="365" y="207" class="cite">Grounded in McCrae &amp; Costa 1989 + Gore &amp; Widiger 2013</text>

  <!-- Bridge diagram -->
  <text x="340" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">The FFM Bridge</text>

  <rect x="40" y="275" width="120" height="40" class="box" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="100" y="300" text-anchor="middle" class="label">Jungian</text>

  <line x1="160" y1="295" x2="220" y2="295" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="288" text-anchor="middle" class="cite">McCrae 1989</text>

  <rect x="225" y="275" width="120" height="40" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="285" y="300" text-anchor="middle" class="label">Big Five (FFM)</text>

  <line x1="345" y1="295" x2="405" y2="295" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="288" text-anchor="middle" class="cite">Gore 2013</text>

  <rect x="410" y="275" width="120" height="40" class="box" fill="#fce7f3" stroke="#ec4899"/>
  <text x="470" y="300" text-anchor="middle" class="label">PID-5</text>

  <text x="555" y="300" class="detail">r = 0.49–0.70</text>

</svg>
