<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Stage 1: Binary -->
  <rect x="20" y="60" width="200" height="160" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="120" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#991b1b">Binary Prediction</text>
  <text x="120" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">Signal counting</text>
  <text x="120" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">3+ axes → label</text>
  <text x="120" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b91c1c">50% agreement</text>
  <text x="120" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">Personality = answer</text>

  <!-- Arrow 1→2 -->
  <line x1="230" y1="140" x2="278" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 2: Continuous -->
  <rect x="290" y="60" width="200" height="160" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="390" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1e3a5f">Continuous Weights</text>
  <text x="390" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">Meta-analysis derived</text>
  <text x="390" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e40af">46,345 participants</text>
  <text x="390" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb">85% agreement</text>
  <text x="390" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">Personality = starting bias</text>

  <!-- Arrow 2→3 -->
  <line x1="500" y1="140" x2="548" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Stage 3: Experience -->
  <rect x="560" y="60" width="220" height="160" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="670" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#14532d">Experience-Modulated</text>
  <text x="670" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Outcome feedback loop</text>
  <text x="670" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Capacity degrades on failure</text>
  <text x="670" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#15803d">Recovers through consolidation</text>
  <text x="670" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#9ca3af">Personality = starting point</text>

  <!-- Bottom label -->
  <text x="400" y="260" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Each stage was forced by evidence the previous stage couldn't explain</text>
</svg>
