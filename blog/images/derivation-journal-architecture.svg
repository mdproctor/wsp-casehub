<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Pipeline stages -->
  <rect x="40" y="30" width="120" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="58" text-anchor="middle" font-size="11" font-weight="600" fill="#1e3a5f">Descriptor</text>

  <rect x="200" y="30" width="120" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="260" y="52" text-anchor="middle" font-size="10" font-weight="600" fill="#312e81">deriveMood</text>
  <text x="260" y="66" text-anchor="middle" font-size="10" font-weight="600" fill="#312e81">Baseline</text>

  <rect x="360" y="30" width="120" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="420" y="52" text-anchor="middle" font-size="10" font-weight="600" fill="#312e81">derive</text>
  <text x="420" y="66" text-anchor="middle" font-size="10" font-weight="600" fill="#312e81">Capacity</text>

  <rect x="520" y="30" width="120" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="580" y="52" text-anchor="middle" font-size="10" font-weight="600" fill="#312e81">derive</text>
  <text x="580" y="66" text-anchor="middle" font-size="10" font-weight="600" fill="#312e81">Appraisal</text>

  <text x="660" y="58" text-anchor="middle" font-size="14" fill="#6366f1">...</text>

  <!-- Arrows between stages -->
  <line x1="160" y1="55" x2="198" y2="55" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="55" x2="358" y2="55" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="55" x2="518" y2="55" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Observer taps (vertical lines down from each stage) -->
  <line x1="260" y1="80" x2="260" y2="130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="420" y1="80" x2="420" y2="130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="580" y1="80" x2="580" y2="130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Computation cells -->
  <rect x="185" y="130" width="150" height="120" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">BASE</text>
  <text x="260" y="165" text-anchor="middle" font-size="9" fill="#78350f">pleasure: 0.10</text>
  <text x="260" y="178" text-anchor="middle" font-size="9" fill="#78350f">arousal: 0.10</text>
  <rect x="195" y="188" width="130" height="1" fill="#fbbf24"/>
  <text x="260" y="202" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">FACET EFFECTS</text>
  <text x="260" y="216" text-anchor="middle" font-size="8" fill="#78350f">Risk Taking → pleasure +0.16</text>
  <text x="260" y="228" text-anchor="middle" font-size="8" fill="#78350f">Emot. Lability → arousal +0.16</text>
  <rect x="195" y="234" width="130" height="1" fill="#fbbf24"/>
  <text x="260" y="247" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">OUTPUT: 0.26, 0.26</text>

  <rect x="345" y="130" width="150" height="120" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">BASE</text>
  <text x="420" y="165" text-anchor="middle" font-size="9" fill="#78350f">wmSpan: 0.75</text>
  <text x="420" y="178" text-anchor="middle" font-size="9" fill="#78350f">assocReach: 0.73</text>
  <rect x="355" y="188" width="130" height="1" fill="#fbbf24"/>
  <text x="420" y="202" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">FACET EFFECTS</text>
  <text x="420" y="216" text-anchor="middle" font-size="8" fill="#78350f">Impulsivity → wmSpan −0.08</text>
  <text x="420" y="228" text-anchor="middle" font-size="8" fill="#78350f">Anxiousness → assoc −0.06</text>
  <rect x="355" y="234" width="130" height="1" fill="#fbbf24"/>
  <text x="420" y="247" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">OUTPUT: 0.67, 0.67</text>

  <rect x="505" y="130" width="150" height="120" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="580" y="150" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">BASE</text>
  <text x="580" y="165" text-anchor="middle" font-size="9" fill="#78350f">fearOnset: 0.95</text>
  <text x="580" y="178" text-anchor="middle" font-size="9" fill="#78350f">urgency: 1.11</text>
  <rect x="515" y="188" width="130" height="1" fill="#fbbf24"/>
  <text x="580" y="202" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">FACET EFFECTS</text>
  <text x="580" y="216" text-anchor="middle" font-size="8" fill="#78350f">Anxiousness → fear +0.12</text>
  <text x="580" y="228" text-anchor="middle" font-size="8" fill="#78350f">Impulsivity → urgency +0.12</text>
  <rect x="515" y="234" width="130" height="1" fill="#fbbf24"/>
  <text x="580" y="247" text-anchor="middle" font-size="9" font-weight="600" fill="#92400e">OUTPUT: 1.07, 1.23</text>

  <!-- Journal accumulator -->
  <rect x="40" y="280" width="640" height="120" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="60" y="305" font-size="12" font-weight="700" fill="#166534">DerivationTrace</text>
  <text x="60" y="325" font-size="10" fill="#166534">PipelineStarted → StageRecorded × 10 → DataFlow × N → PipelineCompleted</text>

  <text x="60" y="350" font-size="10" fill="#166534">trace.effectsOf("Impulsivity")  →  [wmSpan −0.08, urgency +0.12, minSim −0.08, ...]</text>
  <text x="60" y="370" font-size="10" fill="#166534">trace.stagesFor("deriveCapacity")  →  {base: {wm: 0.75}, effects: [...], output: {wm: 0.67}}</text>
  <text x="60" y="390" font-size="10" fill="#166534">trace.entriesForEvent("tick:47")  →  all entries triggered by that prompt</text>

  <!-- Arrows from cells to journal -->
  <line x1="260" y1="250" x2="260" y2="278" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="250" x2="420" y2="278" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="250" x2="580" y2="278" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
