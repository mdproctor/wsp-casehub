<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .label { font-size: 12px; fill: #2d3436; }
    .sublabel { font-size: 10px; fill: #636e72; }
    .emphasis-high { fill: #2d6a4f; }
    .emphasis-med { fill: #52796f; }
    .emphasis-low { fill: #95a5a6; }
    .emphasis-weak { fill: #bdc3c7; }
    .arrow { stroke: #636e72; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#636e72"/>
    </marker>
  </defs>

  <!-- Before -->
  <text x="160" y="28" text-anchor="middle" class="title">Before</text>

  <rect x="30" y="42" width="260" height="52" rx="4" class="emphasis-high" opacity="0.9"/>
  <text x="160" y="62" text-anchor="middle" fill="white" font-size="13" font-weight="600">BODY TERRITORY</text>
  <text x="160" y="80" text-anchor="middle" fill="white" font-size="10">"START the description with..."</text>

  <rect x="30" y="100" width="260" height="52" rx="4" class="emphasis-med" opacity="0.9"/>
  <text x="160" y="120" text-anchor="middle" fill="white" font-size="13" font-weight="600">CONTRAST</text>
  <text x="160" y="138" text-anchor="middle" fill="white" font-size="10">"single most important differentiator"</text>

  <rect x="30" y="158" width="260" height="44" rx="4" class="emphasis-low" opacity="0.9"/>
  <text x="160" y="178" text-anchor="middle" fill="white" font-size="13" font-weight="500">Four channels</text>
  <text x="160" y="192" text-anchor="middle" fill="white" font-size="10">somatic · attentional · temporal · action</text>

  <rect x="30" y="208" width="260" height="36" rx="4" class="emphasis-weak" opacity="0.9"/>
  <text x="160" y="231" text-anchor="middle" fill="#555" font-size="11">"Ground in memories where possible"</text>

  <text x="160" y="268" text-anchor="middle" class="sublabel" font-style="italic">Formation memory: optional, last,</text>
  <text x="160" y="282" text-anchor="middle" class="sublabel" font-style="italic">weak phrasing → LLM deprioritises</text>

  <!-- Arrow -->
  <path d="M 340 160 L 380 160" class="arrow"/>

  <!-- After -->
  <text x="540" y="28" text-anchor="middle" class="title">After</text>

  <rect x="410" y="42" width="260" height="52" rx="4" class="emphasis-high" opacity="0.9"/>
  <text x="540" y="62" text-anchor="middle" fill="white" font-size="13" font-weight="600">FORMATION MEMORY</text>
  <text x="540" y="80" text-anchor="middle" fill="white" font-size="10">"START with what the body LEARNED"</text>

  <rect x="410" y="100" width="260" height="44" rx="4" class="emphasis-med" opacity="0.9"/>
  <text x="540" y="120" text-anchor="middle" fill="white" font-size="13" font-weight="500">BODY TERRITORY</text>
  <text x="540" y="136" text-anchor="middle" fill="white" font-size="10">"Anchor in that territory"</text>

  <rect x="410" y="150" width="260" height="44" rx="4" class="emphasis-low" opacity="0.9"/>
  <text x="540" y="170" text-anchor="middle" fill="white" font-size="13" font-weight="500">Four channels</text>
  <text x="540" y="184" text-anchor="middle" fill="white" font-size="10">somatic · attentional · temporal · action</text>

  <rect x="410" y="200" width="260" height="36" rx="4" class="emphasis-weak" opacity="0.9"/>
  <text x="540" y="223" text-anchor="middle" fill="#555" font-size="11">"Note the contrast briefly"</text>

  <text x="540" y="260" text-anchor="middle" class="sublabel" font-style="italic">Formation memory: mandatory, first,</text>
  <text x="540" y="274" text-anchor="middle" class="sublabel" font-style="italic">strong phrasing → LLM prioritises</text>
</svg>
