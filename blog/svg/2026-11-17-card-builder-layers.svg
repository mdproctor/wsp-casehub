<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>

  <rect width="720" height="340" rx="8" fill="url(#bg)" stroke="#dee2e6"/>

  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#495057">ComposeAttachment — Builder Layers</text>

  <!-- adaptive() path -->
  <rect x="30" y="55" width="200" height="40" rx="6" fill="#4263eb" opacity="0.9"/>
  <text x="130" y="80" text-anchor="middle" font-size="12" fill="white" font-weight="500">adaptive(contentJson)</text>

  <rect x="30" y="110" width="200" height="35" rx="6" fill="#748ffc"/>
  <text x="130" y="132" text-anchor="middle" font-size="11" fill="white">Builder</text>

  <rect x="30" y="160" width="200" height="28" rx="4" fill="#91a7ff"/>
  <text x="130" y="178" text-anchor="middle" font-size="10" fill="white">.preview(title, subtitle, imageUrl)</text>

  <rect x="30" y="200" width="200" height="28" rx="4" fill="#bac8ff"/>
  <text x="130" y="218" text-anchor="middle" font-size="10" fill="#364fc7">.build() → JSON string</text>

  <!-- hero()/thumbnail() path -->
  <rect x="260" y="55" width="200" height="40" rx="6" fill="#2b8a3e" opacity="0.9"/>
  <text x="360" y="80" text-anchor="middle" font-size="12" fill="white" font-weight="500">hero(title) / thumbnail(title)</text>

  <rect x="260" y="110" width="200" height="35" rx="6" fill="#51cf66"/>
  <text x="360" y="132" text-anchor="middle" font-size="11" fill="white">CardBuilder</text>

  <rect x="260" y="155" width="95" height="24" rx="4" fill="#8ce99a"/>
  <text x="307" y="171" text-anchor="middle" font-size="9" fill="#2b8a3e">.text(body)</text>

  <rect x="365" y="155" width="95" height="24" rx="4" fill="#8ce99a"/>
  <text x="412" y="171" text-anchor="middle" font-size="9" fill="#2b8a3e">.button(…)</text>

  <rect x="260" y="188" width="95" height="24" rx="4" fill="#8ce99a"/>
  <text x="307" y="204" text-anchor="middle" font-size="9" fill="#2b8a3e">.tap(…)</text>

  <rect x="365" y="188" width="95" height="24" rx="4" fill="#8ce99a"/>
  <text x="412" y="204" text-anchor="middle" font-size="9" fill="#2b8a3e">.preview(…)</text>

  <rect x="260" y="222" width="200" height="28" rx="4" fill="#b2f2bb"/>
  <text x="360" y="240" text-anchor="middle" font-size="10" fill="#2b8a3e">.build() → JSON string</text>

  <!-- shared helper -->
  <rect x="490" y="110" width="200" height="130" rx="6" fill="#fff3bf" stroke="#fab005" stroke-width="1.5"/>
  <text x="590" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#e67700">Shared Helper</text>

  <text x="590" y="160" text-anchor="middle" font-size="10" fill="#864e00">cardContent(title, subtitle,</text>
  <text x="590" y="175" text-anchor="middle" font-size="10" fill="#864e00">text, imageUrl)</text>

  <line x1="510" y1="195" x2="670" y2="195" stroke="#fab005" stroke-width="0.5"/>

  <text x="590" y="215" text-anchor="middle" font-size="9" fill="#864e00">Emits: title → subtitle →</text>
  <text x="590" y="230" text-anchor="middle" font-size="9" fill="#864e00">text → images (ordered)</text>

  <!-- arrows to shared helper -->
  <line x1="230" y1="175" x2="490" y2="160" stroke="#868e96" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="210" x2="490" y2="195" stroke="#868e96" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#868e96"/>
    </marker>
  </defs>

  <!-- defensive copy callout -->
  <rect x="30" y="270" width="660" height="55" rx="6" fill="#fff5f5" stroke="#ff6b6b" stroke-width="1"/>
  <text x="50" y="292" font-size="11" font-weight="600" fill="#c92a2a">Defensive boundary:</text>
  <text x="210" y="292" font-size="10" fill="#862e2e">InvokeRequest record wraps metadata in Map.copyOf() at construction —</text>
  <text x="50" y="310" font-size="10" fill="#862e2e">handlers cannot mutate the map shared with InboundMessage. The copy is free when the source is already unmodifiable.</text>
</svg>
