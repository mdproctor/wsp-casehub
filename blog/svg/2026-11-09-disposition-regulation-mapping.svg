<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <style>
    text { font-family: 'Inter', 'Helvetica Neue', sans-serif; }
    .title { font-size: 14px; font-weight: 600; fill: #1a1a2e; }
    .axis-label { font-size: 11px; font-weight: 600; fill: #16213e; }
    .value-label { font-size: 10px; fill: #e94560; font-weight: 500; }
    .strategy-label { font-size: 10px; fill: #0f3460; }
    .activation { font-size: 9px; fill: #666; }
    .header { font-size: 11px; font-weight: 600; fill: #fff; }
    .row-bg-even { fill: #f8f9fa; }
    .row-bg-odd { fill: #fff; }
    .header-bg { fill: #16213e; }
    .border { stroke: #dee2e6; stroke-width: 1; fill: none; }
    .arrow { stroke: #e94560; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .connector { stroke: #ccc; stroke-width: 1; stroke-dasharray: 3,3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e94560"/>
    </marker>
  </defs>

  <text x="400" y="25" text-anchor="middle" class="title">Disposition Axes → Regulation Strategy Resting Activations</text>

  <!-- Left column: Disposition values -->
  <rect x="20" y="45" width="200" height="28" rx="3" class="header-bg"/>
  <text x="120" y="64" text-anchor="middle" class="header">Personality Disposition</text>

  <!-- Right column: Regulation strategies -->
  <rect x="350" y="45" width="430" height="28" rx="3" class="header-bg"/>
  <text x="565" y="64" text-anchor="middle" class="header">Regulation Strategy Baseline</text>

  <!-- Row 1: conflictMode: avoidant -->
  <rect x="20" y="78" width="200" height="50" class="row-bg-even"/>
  <rect x="20" y="78" width="200" height="50" class="border"/>
  <text x="30" y="98" class="axis-label">conflictMode</text>
  <text x="30" y="115" class="value-label">avoidant</text>

  <rect x="350" y="78" width="430" height="50" class="row-bg-even"/>
  <rect x="350" y="78" width="430" height="50" class="border"/>
  <text x="360" y="98" class="strategy-label">situation_selection</text>
  <text x="500" y="98" class="activation">+0.20</text>
  <text x="560" y="98" class="strategy-label">social_withdrawal</text>
  <text x="690" y="98" class="activation">+0.15</text>
  <line x1="220" y1="103" x2="350" y2="103" class="arrow"/>

  <!-- Row 2: conflictMode: analytical -->
  <rect x="20" y="128" width="200" height="50" class="row-bg-odd"/>
  <rect x="20" y="128" width="200" height="50" class="border"/>
  <text x="30" y="148" class="axis-label">conflictMode</text>
  <text x="30" y="165" class="value-label">analytical</text>

  <rect x="350" y="128" width="430" height="50" class="row-bg-odd"/>
  <rect x="350" y="128" width="430" height="50" class="border"/>
  <text x="360" y="155" class="strategy-label">cognitive_change</text>
  <text x="500" y="155" class="activation">+0.20</text>
  <line x1="220" y1="153" x2="350" y2="153" class="arrow"/>

  <!-- Row 3: conflictMode: cooperative -->
  <rect x="20" y="178" width="200" height="50" class="row-bg-even"/>
  <rect x="20" y="178" width="200" height="50" class="border"/>
  <text x="30" y="198" class="axis-label">conflictMode</text>
  <text x="30" y="215" class="value-label">cooperative</text>

  <rect x="350" y="178" width="430" height="50" class="row-bg-even"/>
  <rect x="350" y="178" width="430" height="50" class="border"/>
  <text x="360" y="198" class="strategy-label">co_regulation</text>
  <text x="475" y="198" class="activation">+0.15</text>
  <text x="535" y="198" class="strategy-label">social_sharing</text>
  <text x="660" y="198" class="activation">+0.10</text>
  <line x1="220" y1="203" x2="350" y2="203" class="arrow"/>

  <!-- Row 4: conflictMode: competitive -->
  <rect x="20" y="228" width="200" height="50" class="row-bg-odd"/>
  <rect x="20" y="228" width="200" height="50" class="border"/>
  <text x="30" y="248" class="axis-label">conflictMode</text>
  <text x="30" y="265" class="value-label">competitive</text>

  <rect x="350" y="228" width="430" height="50" class="row-bg-odd"/>
  <rect x="350" y="228" width="430" height="50" class="border"/>
  <text x="360" y="248" class="strategy-label">response_modulation</text>
  <text x="520" y="248" class="activation">+0.15</text>
  <text x="580" y="248" class="strategy-label">deliberate_provocation</text>
  <text x="740" y="248" class="activation">+0.10</text>
  <line x1="220" y1="253" x2="350" y2="253" class="arrow"/>

  <!-- Row 5: riskAppetite: conservative -->
  <rect x="20" y="288" width="200" height="50" class="row-bg-even"/>
  <rect x="20" y="288" width="200" height="50" class="border"/>
  <text x="30" y="308" class="axis-label">riskAppetite</text>
  <text x="30" y="325" class="value-label">conservative</text>

  <rect x="350" y="288" width="430" height="50" class="row-bg-even"/>
  <rect x="350" y="288" width="430" height="50" class="border"/>
  <text x="360" y="308" class="strategy-label">situation_selection</text>
  <text x="500" y="308" class="activation">+0.15</text>
  <text x="560" y="308" class="strategy-label">attentional_deployment</text>
  <text x="720" y="308" class="activation">+0.10</text>
  <line x1="220" y1="313" x2="350" y2="313" class="arrow"/>

  <!-- Row 6: riskAppetite: bold -->
  <rect x="20" y="338" width="200" height="50" class="row-bg-odd"/>
  <rect x="20" y="338" width="200" height="50" class="border"/>
  <text x="30" y="358" class="axis-label">riskAppetite</text>
  <text x="30" y="375" class="value-label">bold</text>

  <rect x="350" y="338" width="430" height="50" class="row-bg-odd"/>
  <rect x="350" y="338" width="430" height="50" class="border"/>
  <text x="360" y="358" class="strategy-label">situation_modification</text>
  <text x="520" y="358" class="activation">+0.20</text>
  <text x="580" y="358" class="strategy-label">cognitive_change</text>
  <text x="710" y="358" class="activation">+0.10</text>
  <line x1="220" y1="363" x2="350" y2="363" class="arrow"/>

  <!-- Row 7: socialOrient: cooperative -->
  <rect x="20" y="398" width="200" height="50" class="row-bg-even"/>
  <rect x="20" y="398" width="200" height="50" class="border"/>
  <text x="30" y="418" class="axis-label">socialOrient</text>
  <text x="30" y="435" class="value-label">cooperative</text>

  <rect x="350" y="398" width="430" height="50" class="row-bg-even"/>
  <rect x="350" y="398" width="430" height="50" class="border"/>
  <text x="360" y="418" class="strategy-label">social_support_seeking</text>
  <text x="530" y="418" class="activation">+0.15</text>
  <text x="590" y="418" class="strategy-label">co_regulation</text>
  <text x="700" y="418" class="activation">+0.10</text>
  <line x1="220" y1="423" x2="350" y2="423" class="arrow"/>

  <!-- Row 8: socialOrient: independent -->
  <rect x="20" y="448" width="200" height="50" class="row-bg-odd"/>
  <rect x="20" y="448" width="200" height="50" class="border"/>
  <text x="30" y="468" class="axis-label">socialOrient</text>
  <text x="30" y="485" class="value-label">independent</text>

  <rect x="350" y="448" width="430" height="50" class="row-bg-odd"/>
  <rect x="350" y="448" width="430" height="50" class="border"/>
  <text x="360" y="468" class="strategy-label">response_modulation</text>
  <text x="520" y="468" class="activation">+0.15</text>
  <text x="580" y="468" class="strategy-label">attentional_deployment</text>
  <text x="720" y="468" class="activation">+0.10</text>
  <line x1="220" y1="473" x2="350" y2="473" class="arrow"/>

  <text x="400" y="515" text-anchor="middle" font-size="9" fill="#999">Activations are additive — an agent with both avoidant conflict mode and conservative risk appetite gets situation_selection +0.35</text>
</svg>
