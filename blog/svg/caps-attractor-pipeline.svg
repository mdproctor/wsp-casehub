<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <style>
      text { font-family: -apple-system, 'Segoe UI', sans-serif; }
      .title { font-size: 13px; font-weight: 600; fill: #1e293b; }
      .detail { font-size: 10px; fill: #64748b; }
      .label { font-size: 11px; fill: #475569; font-style: italic; }
      .agent-open { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .agent-cautious { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.5; rx: 6; }
      .shared { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1; rx: 6; }
      .result-open { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5; rx: 6; }
      .result-cautious { fill: #fef9c3; stroke: #eab308; stroke-width: 1.5; rx: 6; }
      .diverge { fill: #fecaca; stroke: #ef4444; stroke-width: 2; rx: 6; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Personality → CAPS Settling → Behavioral Attractors</text>

  <!-- Row 1: Disposition Axes -->
  <rect x="30" y="45" width="170" height="55" class="agent-open"/>
  <text x="115" y="65" text-anchor="middle" class="title">Open Agent</text>
  <text x="115" y="80" text-anchor="middle" class="detail">cooperative / bold / high</text>
  <text x="115" y="92" text-anchor="middle" class="detail">anxiousness: 0.2</text>

  <rect x="600" y="45" width="170" height="55" class="agent-cautious"/>
  <text x="685" y="65" text-anchor="middle" class="title">Cautious Agent</text>
  <text x="685" y="80" text-anchor="middle" class="detail">independent / strict / low</text>
  <text x="685" y="92" text-anchor="middle" class="detail">anxiousness: 0.85</text>

  <!-- Arrows down from disposition -->
  <line x1="115" y1="100" x2="115" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="100" x2="685" y2="125" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2: CAPS Initialization -->
  <rect x="30" y="130" width="170" height="45" class="agent-open"/>
  <text x="115" y="150" text-anchor="middle" class="title">CAPS Weights (open)</text>
  <text x="115" y="165" text-anchor="middle" class="detail">disposition-seeded connections</text>

  <rect x="600" y="130" width="170" height="45" class="agent-cautious"/>
  <text x="685" y="150" text-anchor="middle" class="title">CAPS Weights (cautious)</text>
  <text x="685" y="165" text-anchor="middle" class="detail">disposition-seeded connections</text>

  <text x="400" y="155" text-anchor="middle" class="label">DispositionWeightMapper</text>

  <!-- Arrows down -->
  <line x1="115" y1="175" x2="115" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="175" x2="685" y2="200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: Drive Inputs (different per agent) -->
  <rect x="30" y="205" width="170" height="45" class="agent-open"/>
  <text x="115" y="225" text-anchor="middle" class="title">adventure 0.9 + curiosity 0.8</text>
  <text x="115" y="240" text-anchor="middle" class="detail">→ explore, BAS, approach</text>

  <rect x="600" y="205" width="170" height="45" class="agent-cautious"/>
  <text x="685" y="225" text-anchor="middle" class="title">suspicion 0.9 + self-pres 0.8</text>
  <text x="685" y="240" text-anchor="middle" class="detail">→ threat, BIS, FFFS</text>

  <text x="400" y="230" text-anchor="middle" class="label">DriveCompetitionDetector</text>

  <!-- Arrows down -->
  <line x1="115" y1="250" x2="115" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="250" x2="685" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 4: CAPS Settling (shared engine, different state) -->
  <rect x="250" y="280" width="300" height="40" class="shared"/>
  <text x="400" y="300" text-anchor="middle" class="title">CapsEngine.settle(state, activations)</text>
  <text x="400" y="312" text-anchor="middle" class="detail">same topology, different weights + different inputs</text>

  <!-- Arrows into shared engine -->
  <line x1="115" y1="275" x2="250" y2="295" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="275" x2="550" y2="295" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows out from engine -->
  <line x1="320" y1="320" x2="175" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="320" x2="625" y2="350" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 5: Results (divergent) -->
  <rect x="30" y="355" width="210" height="55" class="result-open"/>
  <text x="135" y="375" text-anchor="middle" class="title">Open Attractors</text>
  <text x="135" y="390" text-anchor="middle" class="detail">regulation: 0.84, learning: 0.58</text>
  <text x="135" y="402" text-anchor="middle" class="detail">approach_avoidance: 0.78</text>

  <rect x="560" y="355" width="210" height="55" class="result-cautious"/>
  <text x="665" y="375" text-anchor="middle" class="title">Cautious Attractors</text>
  <text x="665" y="390" text-anchor="middle" class="detail">regulation: 0.78, learning: 0.52</text>
  <text x="665" y="402" text-anchor="middle" class="detail">approach_avoidance: 0.85</text>

  <!-- Divergence indicator -->
  <rect x="310" y="365" width="180" height="30" class="diverge"/>
  <text x="400" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">≠ divergence proven</text>
</svg>