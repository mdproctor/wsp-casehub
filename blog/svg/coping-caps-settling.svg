<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .layer-label { font-size: 11px; fill: #6b7280; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
    .node { font-size: 11px; fill: #1f2937; }
    .node-box { rx: 6; ry: 6; }
    .input-box { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
    .mediating-box { fill: #fef3c7; stroke: #fbbf24; stroke-width: 1.5; }
    .coping-box { fill: #d1fae5; stroke: #6ee7b7; stroke-width: 1.5; }
    .coping-inert { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; stroke-dasharray: 4,3; }
    .seed-box { fill: #ede9fe; stroke: #a78bfa; stroke-width: 1.5; }
    .arrow { stroke: #9ca3af; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead); }
    .arrow-inhibit { stroke: #ef4444; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead-red); stroke-dasharray: 5,3; }
    .arrow-seed { stroke: #7c3aed; stroke-width: 1.2; fill: none; marker-end: url(#arrowhead-purple); stroke-dasharray: 3,3; }
    .group-label { font-size: 10px; fill: #6b7280; font-style: italic; }
    .weight { font-size: 9px; fill: #6b7280; }
    .formula { font-size: 11px; fill: #7c3aed; font-family: 'SF Mono', 'Menlo', monospace; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#9ca3af"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Layer labels -->
  <text x="30" y="40" class="layer-label">Input Nodes</text>
  <text x="30" y="175" class="layer-label">Mediating Nodes</text>
  <text x="30" y="330" class="layer-label">Coping Outputs</text>
  <text x="560" y="175" class="layer-label">Personality Seed</text>

  <!-- Input nodes -->
  <rect x="160" y="20" width="130" height="30" class="node-box input-box"/>
  <text x="225" y="40" class="node" text-anchor="middle">physical_threat</text>
  <rect x="320" y="20" width="150" height="30" class="node-box input-box"/>
  <text x="395" y="40" class="node" text-anchor="middle">unpredictable_danger</text>
  <rect x="500" y="20" width="100" height="30" class="node-box input-box"/>
  <text x="550" y="40" class="node" text-anchor="middle">reward</text>

  <!-- Mediating nodes -->
  <rect x="80" y="130" width="110" height="30" class="node-box mediating-box"/>
  <text x="135" y="150" class="node" text-anchor="middle">self_efficacy</text>
  <rect x="210" y="130" width="110" height="30" class="node-box mediating-box"/>
  <text x="265" y="150" class="node" text-anchor="middle">BIS_activation</text>
  <rect x="340" y="130" width="120" height="30" class="node-box mediating-box"/>
  <text x="400" y="150" class="node" text-anchor="middle">threat_sensitivity</text>
  <rect x="80" y="185" width="110" height="30" class="node-box mediating-box"/>
  <text x="135" y="205" class="node" text-anchor="middle">other_safety</text>
  <rect x="210" y="185" width="110" height="30" class="node-box mediating-box"/>
  <text x="265" y="205" class="node" text-anchor="middle">BAS_activation</text>
  <rect x="340" y="185" width="110" height="30" class="node-box mediating-box"/>
  <text x="395" y="205" class="node" text-anchor="middle">self_worth</text>

  <!-- Personality seed -->
  <rect x="540" y="130" width="190" height="85" class="node-box seed-box"/>
  <text x="635" y="150" class="node" text-anchor="middle" font-weight="600">CopingDefaults</text>
  <text x="635" y="168" class="formula" text-anchor="middle">bias = (t − 0.5) × 0.5</text>
  <text x="560" y="186" class="node" font-size="10">planful: 0.8 → +0.15</text>
  <text x="560" y="200" class="node" font-size="10">avoidance: 0.2 → −0.15</text>

  <!-- Input → mediating arrows -->
  <path d="M225,50 L265,130" class="arrow"/>
  <path d="M395,50 L400,130" class="arrow"/>
  <path d="M550,50 L265,185" class="arrow"/>

  <!-- Coping output nodes — connected -->
  <text x="85" y="300" class="group-label">Problem-focused</text>
  <rect x="80" y="310" width="90" height="28" class="node-box coping-box"/>
  <text x="125" y="329" class="node" text-anchor="middle">planning</text>
  <rect x="80" y="348" width="140" height="28" class="node-box coping-box"/>
  <text x="150" y="367" class="node" text-anchor="middle">active_confrontation</text>

  <text x="250" y="300" class="group-label">Avoidant</text>
  <rect x="240" y="310" width="90" height="28" class="node-box coping-box"/>
  <text x="285" y="329" class="node" text-anchor="middle">avoidance</text>
  <rect x="240" y="348" width="140" height="28" class="node-box coping-box"/>
  <text x="310" y="367" class="node" text-anchor="middle">mental_disengagement</text>

  <text x="410" y="300" class="group-label">Support-seeking</text>
  <rect x="400" y="310" width="170" height="28" class="node-box coping-box"/>
  <text x="485" y="329" class="node" text-anchor="middle">seek_instrumental_support</text>
  <rect x="400" y="348" width="160" height="28" class="node-box coping-box"/>
  <text x="480" y="367" class="node" text-anchor="middle">seek_emotional_support</text>

  <text x="600" y="300" class="group-label">Cognitive</text>
  <rect x="590" y="310" width="155" height="28" class="node-box coping-box"/>
  <text x="668" y="329" class="node" text-anchor="middle">positive_reinterpretation</text>
  <rect x="590" y="348" width="140" height="28" class="node-box coping-box"/>
  <text x="660" y="367" class="node" text-anchor="middle">coping_acceptance</text>

  <!-- Inert nodes -->
  <text x="85" y="420" class="group-label">Inert (predictor-resolved)</text>
  <rect x="80" y="430" width="80" height="24" class="node-box coping-inert"/>
  <text x="120" y="446" class="node" text-anchor="middle" font-size="10" fill="#9ca3af">denial</text>
  <rect x="170" y="430" width="110" height="24" class="node-box coping-inert"/>
  <text x="225" y="446" class="node" text-anchor="middle" font-size="10" fill="#9ca3af">wishful_thinking</text>
  <rect x="290" y="430" width="110" height="24" class="node-box coping-inert"/>
  <text x="345" y="446" class="node" text-anchor="middle" font-size="10" fill="#9ca3af">procrastination</text>
  <rect x="410" y="430" width="90" height="24" class="node-box coping-inert"/>
  <text x="455" y="446" class="node" text-anchor="middle" font-size="10" fill="#9ca3af">resignation</text>
  <rect x="510" y="430" width="100" height="24" class="node-box coping-inert"/>
  <text x="560" y="446" class="node" text-anchor="middle" font-size="10" fill="#9ca3af">suppression</text>
  <rect x="80" y="462" width="110" height="24" class="node-box coping-inert"/>
  <text x="135" y="478" class="node" text-anchor="middle" font-size="10" fill="#9ca3af">seek_information</text>
  <rect x="200" y="462" width="130" height="24" class="node-box coping-inert"/>
  <text x="265" y="478" class="node" text-anchor="middle" font-size="10" fill="#9ca3af">suppress_information</text>

  <!-- Mediating → coping arrows (selected representative ones) -->
  <path d="M135,160 L125,310" class="arrow"/>
  <text x="115" y="240" class="weight">0.40</text>
  <path d="M265,160 L285,310" class="arrow"/>
  <text x="260" y="240" class="weight">0.40</text>
  <path d="M400,160 L285,310" class="arrow"/>
  <text x="355" y="240" class="weight">0.35</text>
  <path d="M135,215 L485,310" class="arrow"/>
  <text x="310" y="265" class="weight">0.25</text>
  <path d="M395,215 L668,310" class="arrow"/>
  <text x="530" y="265" class="weight">0.25</text>

  <!-- Inhibitory arrow -->
  <path d="M135,160 L285,310" class="arrow-inhibit"/>
  <text x="195" y="255" class="weight" fill="#ef4444">−0.25</text>

  <!-- Seed arrows -->
  <path d="M540,195 L125,310" class="arrow-seed"/>
  <path d="M540,200 L285,310" class="arrow-seed"/>
  <path d="M540,205 L660,348" class="arrow-seed"/>

  <!-- Legend -->
  <rect x="80" y="500" width="12" height="3" fill="#9ca3af"/>
  <text x="98" y="504" class="node" font-size="10">excitatory</text>
  <rect x="170" y="500" width="12" height="3" fill="#ef4444" stroke-dasharray="5,3"/>
  <text x="188" y="504" class="node" font-size="10">inhibitory</text>
  <rect x="260" y="500" width="12" height="3" fill="#7c3aed" stroke-dasharray="3,3"/>
  <text x="278" y="504" class="node" font-size="10">personality seed</text>
  <rect x="390" y="496" width="30" height="12" class="node-box coping-inert"/>
  <text x="428" y="506" class="node" font-size="10">predictor-only (no CAPS connections)</text>
</svg>