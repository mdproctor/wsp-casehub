<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Before: Duplicate Inline Enrichment</text>

  <!-- Before: two boxes with duplicate code -->
  <rect x="30" y="50" width="300" height="130" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle" font-weight="600" fill="#e65100">BehavioralSynthesisPhase</text>
  <text x="50" y="95" fill="#555" font-size="11">addPersonalityMetadata()</text>
  <text x="50" y="112" fill="#888" font-size="10">├─ disposition axes</text>
  <text x="50" y="127" fill="#888" font-size="10">├─ PID-5 facets</text>
  <text x="50" y="142" fill="#c62828" font-size="10" font-weight="600">└─ appraisal weights ✗ MISSING</text>
  <text x="50" y="162" fill="#999" font-size="10" font-style="italic">25 lines of inline enrichment</text>

  <rect x="390" y="50" width="300" height="130" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="540" y="72" text-anchor="middle" font-weight="600" fill="#e65100">DriveProfileDerivationPhase</text>
  <text x="410" y="95" fill="#555" font-size="11">addPersonalityMetadata()</text>
  <text x="410" y="112" fill="#888" font-size="10">├─ disposition axes</text>
  <text x="410" y="127" fill="#888" font-size="10">├─ PID-5 facets</text>
  <text x="410" y="142" fill="#c62828" font-size="10" font-weight="600">└─ appraisal weights ✗ MISSING</text>
  <text x="410" y="162" fill="#999" font-size="10" font-style="italic">25 lines of inline enrichment</text>

  <!-- Orphaned enricher -->
  <rect x="220" y="195" width="280" height="35" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="360" y="217" text-anchor="middle" fill="#c62828" font-size="11">PersonalityMetadataEnricher — 0 callers (orphaned)</text>

  <!-- Divider -->
  <line x1="30" y1="250" x2="690" y2="250" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="360" y="272" text-anchor="middle" font-size="15" font-weight="600" fill="#333">After: Consolidated via LearningProfile</text>

  <!-- After: two thin boxes delegating to enricher -->
  <rect x="30" y="290" width="250" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="155" y="312" text-anchor="middle" font-weight="600" fill="#2e7d32" font-size="11">BehavioralSynthesisPhase</text>
  <text x="155" y="330" text-anchor="middle" fill="#555" font-size="10">3 lines → delegates to enricher</text>

  <rect x="440" y="290" width="250" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="565" y="312" text-anchor="middle" font-weight="600" fill="#2e7d32" font-size="11">DriveProfileDerivationPhase</text>
  <text x="565" y="330" text-anchor="middle" fill="#555" font-size="10">3 lines → delegates to enricher</text>

  <!-- Arrows to enricher -->
  <line x1="280" y1="330" x2="330" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="330" x2="390" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Enricher box -->
  <rect x="250" y="355" width="220" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="360" y="373" text-anchor="middle" font-weight="600" fill="#2e7d32" font-size="11">PersonalityMetadataEnricher</text>
  <text x="360" y="388" text-anchor="middle" fill="#555" font-size="10">axes + facets + appraisal weights ✓</text>
</svg>
