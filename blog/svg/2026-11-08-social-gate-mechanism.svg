<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, -apple-system, sans-serif">
  <style>
    text { font-size: 12px; fill: #333; }
    .title { font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .box { rx: 6; stroke-width: 1.5; }
    .label { font-size: 11px; font-weight: 500; }
    .small { font-size: 10px; fill: #666; }
    .arrow { fill: none; stroke: #666; stroke-width: 1.5; marker-end: url(#arr); }
    .yes { fill: #22c55e; }
    .no { fill: #ef4444; }
    .gate { fill: #fbbf24; stroke: #d97706; }
    .prompt { fill: #dbeafe; stroke: #3b82f6; }
    .result { fill: #f0fdf4; stroke: #22c55e; }
  </style>
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#666"/>
    </marker>
  </defs>

  <text x="360" y="25" text-anchor="middle" class="title">Social Gate: How the LLM Prompt Adapts to Context</text>

  <!-- Appraisal fires -->
  <rect x="30" y="50" width="140" height="40" class="box" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="100" y="75" text-anchor="middle" class="label" fill="#4338ca">Appraisal fires</text>

  <line x1="170" y1="70" x2="220" y2="70" class="arrow"/>

  <!-- Regulation activation -->
  <rect x="220" y="50" width="160" height="40" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="300" y="65" text-anchor="middle" class="label" fill="#92400e">Discrepancy &gt;</text>
  <text x="300" y="80" text-anchor="middle" class="label" fill="#92400e">threshold?</text>

  <line x1="380" y1="70" x2="430" y2="70" class="arrow"/>

  <!-- Social gate diamond -->
  <polygon points="510,45 580,70 510,95 440,70" class="gate"/>
  <text x="510" y="67" text-anchor="middle" class="label" fill="#92400e" font-size="10">interacting</text>
  <text x="510" y="79" text-anchor="middle" class="label" fill="#92400e" font-size="10">Agents?</text>

  <!-- Yes path -->
  <line x1="510" y1="95" x2="510" y2="140" class="arrow"/>
  <text x="520" y="120" class="yes label" font-size="10">non-empty</text>

  <!-- No path -->
  <line x1="580" y1="70" x2="650" y2="70" class="arrow"/>
  <text x="605" y="62" class="no label" font-size="10">empty</text>

  <!-- Full prompt (social + intrapersonal) -->
  <rect x="370" y="140" width="280" height="100" class="prompt box"/>
  <text x="510" y="162" text-anchor="middle" font-weight="600" fill="#1e40af" font-size="12">Full Prompt (10 strategies)</text>
  <text x="510" y="180" text-anchor="middle" class="small">Gross 5 intrapersonal +</text>
  <text x="510" y="194" text-anchor="middle" class="small">Zaki &amp; Williams 5 social</text>
  <text x="510" y="212" text-anchor="middle" class="small">+ available agents list</text>
  <text x="510" y="226" text-anchor="middle" class="small">+ socialRegulationTendency</text>

  <!-- Intrapersonal-only prompt -->
  <rect x="600" y="90" width="100" height="55" class="box" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="650" y="112" text-anchor="middle" class="label" fill="#374151" font-size="10">Gross 5 only</text>
  <text x="650" y="126" text-anchor="middle" class="small">(existing)</text>

  <!-- LLM output -->
  <line x1="510" y1="240" x2="510" y2="270" class="arrow"/>

  <!-- Result -->
  <rect x="370" y="270" width="280" height="70" class="result box"/>
  <text x="510" y="292" text-anchor="middle" font-weight="600" fill="#166534" font-size="12">EmotionRegulationResult</text>
  <text x="510" y="310" text-anchor="middle" class="small">strategy + targetAgentId + narrative</text>
  <text x="510" y="324" text-anchor="middle" class="small">validated: targetAgentId ∈ interactingAgents</text>

  <!-- Personality input -->
  <rect x="30" y="160" width="160" height="55" class="box" fill="#fdf2f8" stroke="#ec4899"/>
  <text x="110" y="182" text-anchor="middle" class="label" fill="#9d174d" font-size="11">socialRegulationTendency</text>
  <text x="110" y="198" text-anchor="middle" class="small">derived from disposition axes</text>

  <line x1="190" y1="187" x2="370" y2="187" class="arrow"/>

  <!-- RegulationTracker input -->
  <rect x="30" y="230" width="160" height="55" class="box" fill="#fff7ed" stroke="#f97316"/>
  <text x="110" y="252" text-anchor="middle" class="label" fill="#9a3412" font-size="11">RegulationTracker</text>
  <text x="110" y="268" text-anchor="middle" class="small">distress trajectories for</text>
  <text x="110" y="280" text-anchor="middle" class="small">nearby agents</text>

  <line x1="190" y1="257" x2="370" y2="220" class="arrow"/>
</svg>
