<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-fused" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Before: Orchestrated Steps (materialise at every boundary)</text>

  <!-- Row 1: Before fusion -->
  <rect x="20" y="44" width="140" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">media-download</text>
  <text x="90" y="82" text-anchor="middle" font-size="10" fill="#64748b">String → InputStream</text>

  <line x1="164" y1="70" x2="198" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="181" y="62" text-anchor="middle" font-size="9" fill="#94a3b8">serialise</text>

  <rect x="202" y="44" width="140" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="272" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">denoise</text>
  <text x="272" y="82" text-anchor="middle" font-size="10" fill="#64748b">InputStream → InputStream</text>

  <line x1="346" y1="70" x2="380" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="363" y="62" text-anchor="middle" font-size="9" fill="#94a3b8">serialise</text>

  <rect x="384" y="44" width="140" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="454" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">stt-transcribe</text>
  <text x="454" y="82" text-anchor="middle" font-size="10" fill="#64748b">InputStream → String</text>

  <line x1="528" y1="70" x2="562" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="62" text-anchor="middle" font-size="9" fill="#94a3b8">serialise</text>

  <rect x="566" y="44" width="134" height="52" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="633" y="65" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">text-cleanup</text>
  <text x="633" y="82" text-anchor="middle" font-size="10" fill="#64748b">String → String</text>

  <!-- Divider -->
  <line x1="20" y1="120" x2="700" y2="120" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Title Row 2 -->
  <text x="360" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">After: FusionPass detects type-compatible chain → single execution unit</text>

  <!-- Row 2: After fusion -->
  <rect x="20" y="168" width="540" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="290" y="186" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">FusedPipelineStep — near-native piped execution</text>

  <rect x="36" y="198" width="120" height="32" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="96" y="218" text-anchor="middle" font-size="10" fill="#1e40af">media-download</text>

  <line x1="160" y1="214" x2="186" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-fused)"/>

  <rect x="190" y="198" width="100" height="32" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="240" y="218" text-anchor="middle" font-size="10" fill="#1e40af">denoise</text>

  <line x1="294" y1="214" x2="320" y2="214" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-fused)"/>

  <rect x="324" y="198" width="120" height="32" rx="4" fill="white" stroke="#93c5fd" stroke-width="1"/>
  <text x="384" y="218" text-anchor="middle" font-size="10" fill="#1e40af">stt-transcribe</text>

  <text x="468" y="218" text-anchor="middle" font-size="9" fill="#64748b">AutoCloseable</text>
  <text x="468" y="228" text-anchor="middle" font-size="9" fill="#64748b">cleanup on failure</text>

  <line x1="564" y1="204" x2="598" y2="204" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="581" y="196" text-anchor="middle" font-size="9" fill="#94a3b8">materialise</text>

  <rect x="602" y="188" width="98" height="32" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="651" y="208" text-anchor="middle" font-size="10" fill="#334155">text-cleanup</text>

  <!-- Annotations -->
  <rect x="20" y="268" width="320" height="60" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="36" y="288" font-size="11" font-weight="500" fill="#854d0e">Playbook provides per-stage:</text>
  <text x="36" y="306" font-size="10" fill="#713f12">retry · timeout · delay · error handling · routing</text>
  <text x="36" y="320" font-size="10" fill="#713f12">All via YAML config — zero custom pipeline code</text>

  <rect x="380" y="268" width="320" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="396" y="288" font-size="11" font-weight="500" fill="#166534">Compiler detects automatically when:</text>
  <text x="396" y="306" font-size="10" fill="#14532d">consumer.inputType().isAssignableFrom(</text>
  <text x="396" y="320" font-size="10" fill="#14532d">    producer.outputType())  →  fuse into chain</text>
</svg>
