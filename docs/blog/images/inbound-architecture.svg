<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <!-- Left column: Sources -->
  <text x="80" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">Inbound Sources</text>

  <rect x="10" y="36" width="140" height="44" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="80" y="55" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">WhatsApp</text>
  <text x="80" y="70" text-anchor="middle" font-size="9" fill="#a16207">webhook + media download</text>

  <rect x="10" y="90" width="140" height="44" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="109" text-anchor="middle" font-size="11" font-weight="500" fill="#1e40af">Gmail Push</text>
  <text x="80" y="124" text-anchor="middle" font-size="9" fill="#1d4ed8">Pub/Sub → history.list</text>

  <rect x="10" y="144" width="140" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="163" text-anchor="middle" font-size="11" font-weight="500" fill="#3730a3">Signal</text>
  <text x="80" y="178" text-anchor="middle" font-size="9" fill="#4338ca">WebSocket + attachments</text>

  <rect x="10" y="198" width="140" height="44" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="80" y="217" text-anchor="middle" font-size="11" font-weight="500" fill="#9d174d">Discord</text>
  <text x="80" y="232" text-anchor="middle" font-size="9" fill="#be185d">Gateway + attachments</text>

  <rect x="10" y="252" width="140" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="80" y="274" text-anchor="middle" font-size="10" fill="#64748b">IMAP IDLE (existing)</text>

  <!-- Arrows to centre -->
  <line x1="154" y1="58" x2="220" y2="140" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="154" y1="112" x2="220" y2="140" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="154" y1="166" x2="220" y2="150" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="154" y1="220" x2="220" y2="160" stroke="#475569" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Centre: InboundMessage CDI Event -->
  <rect x="224" y="120" width="170" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="309" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">InboundMessage</text>
  <text x="309" y="158" text-anchor="middle" font-size="10" fill="#15803d">CDI async event</text>
  <text x="309" y="170" text-anchor="middle" font-size="9" fill="#16a34a">+ Attachment(byte[])</text>

  <!-- Arrow to CloudEvent -->
  <line x1="398" y1="148" x2="440" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CloudEvent -->
  <rect x="444" y="126" width="120" height="44" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="504" y="145" text-anchor="middle" font-size="10" font-weight="500" fill="#5b21b6">CloudEvent</text>
  <text x="504" y="160" text-anchor="middle" font-size="9" fill="#6d28d9">type: inbound.{type}</text>

  <!-- Arrow to Playbook -->
  <line x1="568" y1="148" x2="596" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Playbook pipeline -->
  <rect x="600" y="100" width="110" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="655" y="120" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Playbook</text>
  <text x="655" y="136" text-anchor="middle" font-size="9" fill="#2563eb">match content-type</text>
  <text x="655" y="152" text-anchor="middle" font-size="9" fill="#2563eb">audio/* → STT step</text>
  <text x="655" y="168" text-anchor="middle" font-size="9" fill="#2563eb">retry · timeout</text>
  <text x="655" y="184" text-anchor="middle" font-size="9" fill="#2563eb">per-app config</text>

  <!-- VoicePlatform SPI box -->
  <rect x="440" y="220" width="270" height="68" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="575" y="240" text-anchor="middle" font-size="11" font-weight="600" fill="#c2410c">VoicePlatform SPI</text>
  <text x="500" y="258" font-size="10" fill="#9a3412">SpeechToText</text>
  <text x="500" y="272" font-size="9" fill="#9a3412">transcribe(byte[], opts)</text>
  <text x="630" y="258" font-size="10" fill="#9a3412">TextToSpeech</text>
  <text x="630" y="272" font-size="9" fill="#9a3412">synthesise(text, opts)</text>

  <!-- Arrow from playbook to VoicePlatform -->
  <line x1="655" y1="200" x2="620" y2="216" stroke="#f97316" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="224" y="260" font-size="9" fill="#64748b">Connectors delivers raw events.</text>
  <text x="224" y="274" font-size="9" fill="#64748b">Apps compose playbook pipelines.</text>
  <text x="224" y="288" font-size="9" fill="#64748b">VoicePlatform provides STT/TTS.</text>
</svg>
